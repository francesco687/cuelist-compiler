name: Saetta
options:
  bundleIdPrefix: com.blearred
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: UWJSLFQDGL
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
targets:
  SaettaKit:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Kit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blearred.saetta.kit
        ENABLE_TESTABILITY: YES
        GENERATE_INFOPLIST_FILE: YES
  Saetta:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
    dependencies:
      - target: SaettaKit
    info:
      path: Sources/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: "Saetta connects to your hub on the local network to send shows to your console."
        NSMicrophoneUsageDescription: "Saetta records short voice commands to author cues."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blearred.saetta
  SaettaKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/KitTests
      - path: ../examples/SONG_1.json
        buildPhase: resources
    dependencies:
      - target: SaettaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blearred.saetta.kittests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SaettaKit:
    build:
      targets:
        SaettaKit: all
    test:
      targets:
        - SaettaKitTests
  Saetta:
    build:
      targets:
        Saetta: all
